services:
  - type: web
    name: FON
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TEXT_MODEL
        value: "gemini-3.6-flash"
      - key: TEXT_MODEL_FALLBACK
        value: "gemini-3.5-flash-lite,gemini-3.1-flash-lite"
      - key: IMAGE_MODEL
        value: "gemini-3.1-flash-lite-image"
      - key: TTS_MODEL
        value: "gemini-3.8-flash-tts,gemini-3.8-flash-lite-tts,gemini-3.1-flash-tts-preview,gemini-2.5-flash-preview-tts"
      - key: MAX_WORDS
        value: "1200"
      - key: EXT_PATH
        value: "1"
      - key: LIVE_STREAM_EXT
        value: "7"
      - key: HISTORY_EXT
        value: "9"
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_TTS_KEYS
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: YEMOT_TOKEN
        sync: false
      - key: TARGET_EMAIL
        sync: false
      - key: GAS_MAIL_URL
        sync: false
      - key: GAS_MAIL_SECRET
        sync: false
      - key: RADIO_FEEDS
        sync: false
      - key: GOOGLE_SEARCH_CX
        sync: false
      - key: GOOGLE_SEARCH_KEY
        sync: false
